<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        input, button { padding: 10px; font-size: 14px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .delete-btn { color: #dc3545; text-decoration: none; font-weight: bold; }
        .delete-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h2>Add New User</h2>
    <form action="/" method="POST">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <button type="submit">Submit</button>
    </form>

    <h2>Registered Users</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <a href="/delete/{{ user.id }}" class="delete-btn" onclick="return confirm('Delete this record?');">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No users found in database.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
